version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/nextcloud
    binary: nextcloud
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/plivox/nextcloud-cli/internal/cli.buildVersion={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

homebrew_casks:
  - name: nextcloud-cli
    binaries: [nextcloud]
    repository:
      owner: plivox
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/plivox/nextcloud-cli
    description: Command-line client and MCP server for Nextcloud Files and Deck
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/nextcloud"]
          end
